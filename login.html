<!DOCTYPE html>
<html>

<head>
    <title>Login Page</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: #0b1f3a;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 350px;
            padding: 35px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        h2 {
            text-align: center;
            color: #0b1f3a;
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #0b1f3a;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            box-sizing: border-box;
            border: 1px solid #0b1f3a;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border: 2px solid #164a86;
        }

        button {
            width: 100%;
            padding: 11px;
            background-color: #0b1f3a;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #164a86;
        }

        #message {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
            color: #0b1f3a;
        }
    </style>

</head>

<body>

    <div class="login-box">

        <h2>Webpage Login</h2>

        <label>Username</label>
        <input type="text" id="username">

        <br><br>

        <label>Password</label>
        <input type="password" id="password">

        <br><br>

        <button id="login_button">Login</button>

        <p id="message"></p>

    </div>


    <script>

        let username = document.getElementById("username");
        let password = document.getElementById("password");
        let login_button = document.getElementById("login_button");
        let message = document.getElementById("message");

        login_button.addEventListener("click", function() {

            let user = username.value;
            let pass = password.value;

            if (user === "manu" && pass === "12345") {
                message.innerHTML = "Login successful";
            }
            else {
                message.innerHTML = "Invalid login";
            }

        });

    </script>

</body>

</html>
